[package]
name = "anchor-gen-cli"
description = "CLI to decode Solana account data and generate decoders from Anchor IDLs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "account-decoder"
path = "src/main.rs"

[dependencies]
account-decoder-anchor-gen = { workspace = true }
account-decoder-core = { workspace = true }
account-decoder-decoders = { workspace = true }
account-decoder-sdk = { workspace = true }
solana-sdk = { workspace = true }
base64 = "0.22"
clap = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Used to parse and pretty-print the generated token stream before writing it.
syn = { workspace = true }
quote = { workspace = true }
prettyplease = "0.2"
