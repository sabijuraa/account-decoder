name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version and this action honours it, so CI
      # and a local checkout compile with the same compiler.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Everything this project claims is provable offline: the account
      # fixtures are committed `getAccountInfo` responses, so no RPC, no
      # network and no validator is needed.
      - name: Test
        run: cargo test --workspace

      # The examples in the docs are compiled and run, not just checked, so a
      # signature change breaks the build rather than the documentation.
      - name: Doc tests
        run: cargo test --workspace --doc

      - name: Examples run
        run: |
          for example in basic_usage custom_decoder zero_copy; do
            echo "--- $example ---"
            cargo run -q -p account-decoder-sdk --example "$example"
          done

  cli:
    name: CLI decodes real accounts
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --bin account-decoder

      # End to end through the shipped binary, against the same mainnet
      # fixtures the tests use.
      - name: Decode the USDC mint
        run: |
          ./target/debug/account-decoder decode \
            --file crates/decoders/tests/fixtures/usdc_mint.json \
            --program TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA \
            | tee /tmp/usdc.txt
          grep -q "decimals: 6" /tmp/usdc.txt

      - name: Decode the Raydium pool by trying every decoder
        run: |
          ./target/debug/account-decoder decode \
            --file crates/decoders/tests/fixtures/raydium_amm_sol_usdc.json \
            | tee /tmp/pool.txt
          grep -q "raydium-amm-v4" /tmp/pool.txt
          grep -q "So11111111111111111111111111111111111111112" /tmp/pool.txt

      # The generator has to keep producing what is committed: if codegen
      # changes and the checked-in file is not regenerated, this fails.
      #
      # Both sides are run through rustfmt first. The generator pretty-prints
      # with prettyplease and the committed file is formatted by `cargo fmt`,
      # so an unnormalised diff would report a line-wrapping difference as a
      # stale generator.
      - name: Generated code is up to date
        run: |
          cargo run -q --bin account-decoder -- generate \
            crates/anchor-gen/tests/fixtures/marinade_idl.json -o /tmp/gen
          rustfmt --edition 2021 /tmp/gen/marinade_finance.rs
          cp crates/generated-marinade/src/generated.rs /tmp/committed.rs
          rustfmt --edition 2021 /tmp/committed.rs
          diff -u /tmp/committed.rs /tmp/gen/marinade_finance.rs

  bench:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Compiled but not measured: timings from a shared runner are noise, and
      # a benchmark that silently stops compiling is the real risk.
      - name: Build benchmarks
        run: cargo bench --workspace --no-run
